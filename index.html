<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وَحْش سينما | WAHSH CINEMA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- شريط التنقل العلوي -->
    <header class="navbar">
       <div class="logo" style="font-size: 20px;">
    🎬 Omar, s cima 🌚🙂
</div>
        
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="ابحث في الأفلام...">
        </div>
    </header>

    <!-- بانر عرض سينمائي فخم -->
    <section class="hero-banner">
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <span class="hero-badge">الأكثر مشاهدة VIP</span>
            <h1>Godfather VIP</h1>
            <p>استمتع بأقوى الأفلام الحصرية بجودة سينمائية فائقة مع الترجمة العربية الفورية.</p>
        </div>
    </section>

    <!-- المحتوى الرئيسي -->
    <main class="main-content">
       <!-- فلاتر التصنيفات المنظمة -->
        <div class="filter-bar" style="overflow-x: auto; white-space: nowrap; padding-bottom: 10px;">
            <button class="filter-btn active" data-category="all">الكل</button>
            <button class="filter-btn" data-category="foreign-action">أكشن أجنبي</button>
            <button class="filter-btn" data-category="foreign-romance">رومانسي أجنبي</button>
            <button class="filter-btn" data-category="foreign-drama">دراما أجنبي</button>
            <button class="filter-btn" data-category="arabic">أفلام عربي</button>
            <button class="filter-btn" data-category="arabic-series">مسلسلات عربي</button>
            <button class="filter-btn" data-category="cartoon-movies">أفلام كرتون</button>
            <button class="filter-btn" data-category="cartoon-series">مسلسلات كرتون</button>
            <button class="filter-btn" data-category="anime-movies">أفلام أنمي</button>
            <button class="filter-btn" data-category="anime-series">مسلسلات أنمي</button>
            <button class="filter-btn" data-category="cartoons">توم وجيري</button>
        </div>

        <!-- شبكة عرض الأفلام -->
        <div class="movies-grid" id="moviesGrid">
            <!-- سيتم تعبئة الأفلام تلقائياً عبر JavaScript -->
        </div>
    </main>

    <!-- نافذة العرض (Modal) -->
    <div class="video-modal" id="videoModal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <span id="modalTitle">عنوان الفيلم</span>
                <div class="modal-actions">
                    <!-- زر الخيارات (إعدادات الجودة والترجمة) -->
                    <div class="dropdown-container">
                        <button id="dotsBtn" class="options-btn">⚙️ إعدادات العرض</button>
                        <div id="dotsDropdown" class="dropdown-menu" style="display: none;">
                            <button id="hdToggleBtn" class="setting-option-btn">
                                ⚡ الجودة العالية (HD): <span id="hdStatus">مفعل</span>
                            </button>
                            <button id="subToggleBtn" class="setting-option-btn">
                                💬 الترجمة العربية: <span id="subStatus">معطل</span>
                            </button>
                        </div>
                    </div>
                    <button id="closeModal" class="close-btn">&times;</button>
                </div>
            </div>
            <div class="player-container">
                <iframe id="youtubePlayer" src="" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
