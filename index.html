<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الأفلام | سينما VIP</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- شريط التنقل العلوي -->
    <header class="navbar">
        <div class="logo">🎬 سينما VIP</div>
        
        <!-- زر تحميل VidMate في الواجهة الرئيسية (للتحميل أولاً) -->
        <div class="vidmate-promo">
            <a href="https://www.vidmateapp.com/" target="_blank" class="vidmate-download-btn">
                <span class="vidmate-icon">📥</span>
                <span>حمّل تطبيق <strong>VidMate</strong> أولاً</span>
            </a>
        </div>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="ابحث عن فيلمك المفضلة...">
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="main-content">
        <!-- فلاتر التصنيفات -->
        <div class="filter-bar">
            <button class="filter-btn active" data-category="all">الكل</button>
            <button class="filter-btn" data-category="action">أكشن وحصري</button>
        </div>

        <!-- شبكة عرض الأفلام -->
        <div class="movies-grid" id="moviesGrid">
            <!-- سيتم تعبئة الأفلام تلقائياً عبر JavaScript -->
        </div>
    </main>

    <!-- نافذة العرض (Modal) -->
    <div class="video-modal" id="videoModal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <span id="modalTitle">عنوان الفيلم</span>
                <div class="modal-actions">
                    <!-- زر الخيارات القائمة المنسدلة -->
                    <div class="dropdown-container">
                        <button id="dotsBtn" class="options-btn">⚙️ خيارات التحميل</button>
                        <div id="dotsDropdown" class="dropdown-menu" style="display: none;">
                            <!-- صندوق توضيحي لشرح VidMate وزر النسخ -->
                            <div class="vidmate-info-box">
                                <p class="info-title">💡 ما هو VidMate؟</p>
                                <p class="info-desc">أفضل تطبيق لتحميل الفيديوهات بجودات عالية. انسخ رابط الفيلم أدناه والصقه داخل التطبيق للتحميل الفوري.</p>
                            </div>
                            <a href="#" id="downloadLink" class="copy-link-btn">📋 انسخ رابط الفيلم</a>
                            <a href="https://www.vidmateapp.com/" target="_blank" class="external-vidmate-btn">📥 تحميل تطبيق VidMate</a>
                            <button id="enhanceBtn" class="enhance-action-btn">تحسين الصورة: <span id="enhanceStatus">مفعل</span></button>
                        </div>
                    </div>
                    <button id="closeModal" class="close-btn">&times;</button>
                </div>
            </div>
            <div class="player-container">
                <iframe id="youtubePlayer" src="" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
